services:
  postgres:
    image: postgres:17
    container_name: churn-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churn}"]
      interval: 5s
      timeout: 3s
      retries: 5
    
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    
  api:
    build: .
    container_name: churn-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - models:/code/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    

volumes:
  pgdata:
  models: