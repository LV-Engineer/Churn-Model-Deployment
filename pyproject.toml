[project]
name = "churn-model-deployment"
version = "0.1.0"
description = "Serving and monitoring a customer churn model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]